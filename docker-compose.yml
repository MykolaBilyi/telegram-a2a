version: '3.9'
services:
  telegram-a2a:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1
        PORT: 8080
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - KAGENT_A2A_URL=${KAGENT_A2A_URL}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - 8080:8080